{%- comment -%}
  ICON SPRITE
  Inlined once, at the top of <body>, and referenced everywhere else with
  <use href="#tb-name">.

  Inlined rather than linked as an external file on purpose: an external sprite
  costs a round trip on every page and silently fails under file:// and some
  strict CSP setups. This way icons are always there, they inherit currentColor
  for free, and the theme has no dependency on a CDN or an icon font.

  Every symbol is a 24×24 stroke drawing on the same grid: 1.75 stroke, round
  caps and joins, no fills. That consistency is what makes a row of them look
  like one set rather than a collection.

  Add an icon by adding a <symbol id="tb-yourname">. Use it with
  {% raw %}{% include icon.html name="yourname" %}{% endraw %}.
{%- endcomment -%}
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
