<!--
  README BANNER
  The repository's shop-front image, drawn for this theme like all its other
  artwork. Same gradient and cloud mark as logo.svg, so the repo, the OG image
  and the favicon all read as one brand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"
     role="img" aria-label="Trailblazer — a Jekyll theme for Salesforce developers">
  <defs>
    <linearGradient id="g-bn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a9bef"/>
      <stop offset="1" stop-color="#01508f"/>
    </linearGradient>
    <pattern id="p-bn" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#fff" opacity="0.14"/>
    </pattern>
    <linearGradient id="g-bn-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6fe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#g-bn)"/>
  <rect width="1200" height="400" rx="16" fill="url(#p-bn)"/>
  <ellipse cx="1030" cy="30" rx="420" ry="210" fill="#fff" opacity="0.10"/>

  <!-- The mark -->
  <g transform="translate(84 88)">
    <rect width="72" height="72" rx="17" fill="#fff" opacity="0.16"/>
    <g transform="translate(4 4) scale(2.67)" fill="none" stroke="#fff"
       stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5 16H7a4 4 0 0 1-.5-7.97 5 5 0 0 1 9.6-1.1A3.6 3.6 0 0 1 17.5 16Z"/>
      <circle cx="12" cy="11.5" r="1.8"/>
      <path d="M9 20.5a3.2 3.2 0 0 1 6 0"/>
    </g>
  </g>

  <!-- Wordmark and tagline -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="184" y="140" font-size="58" font-weight="700" fill="#ffffff"
          letter-spacing="-1">Trailblazer</text>
    <text x="186" y="182" font-size="24" fill="#dbeefe">A Jekyll theme for Salesforce developers.</text>

    <!-- Feature chips -->
    <g font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">
      <g opacity="0.92">
        <rect x="84"  y="228" width="176" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
        <rect x="272" y="228" width="188" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
        <rect x="472" y="228" width="176" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
        <rect x="84"  y="280" width="184" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
        <rect x="280" y="280" width="160" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
        <rect x="452" y="280" width="196" height="40" rx="20" fill="#ffffff" opacity="0.14"/>
      </g>
      <text x="172" y="254">Printable resume</text>
      <text x="366" y="254">Certification wall</text>
      <text x="560" y="254">7 collections</text>
      <text x="176" y="306">Lesson player</text>
      <text x="360" y="306">⌘K search</text>
      <text x="550" y="306">No build step</text>
    </g>
  </g>

  <!-- A miniature browser window, hinting at the product -->
  <g transform="translate(724 92)">
    <rect width="392" height="252" rx="12" fill="url(#g-bn-card)"/>
    <rect width="392" height="34" rx="12" fill="#0b3a63"/>
    <rect y="22" width="392" height="12" fill="#0b3a63"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5" fill="#28c840"/>
    <rect x="146" y="9" width="140" height="16" rx="8" fill="#ffffff" opacity="0.18"/>

    <!-- header island -->
    <rect x="96" y="48" width="200" height="22" rx="11" fill="#0176d3" opacity="0.12"/>
    <!-- hero lines -->
    <rect x="28" y="92" width="220" height="14" rx="7" fill="#16325c"/>
    <rect x="28" y="114" width="164" height="14" rx="7" fill="#16325c" opacity="0.75"/>
    <rect x="28" y="140" width="196" height="8" rx="4" fill="#54698d" opacity="0.55"/>
    <rect x="28" y="154" width="172" height="8" rx="4" fill="#54698d" opacity="0.55"/>
    <!-- buttons -->
    <rect x="28" y="180" width="88" height="26" rx="13" fill="#0176d3"/>
    <rect x="124" y="180" width="88" height="26" rx="13" fill="none" stroke="#0176d3" stroke-width="2"/>
    <!-- certification seals -->
    <g stroke="#ffffff" stroke-width="2">
      <circle cx="300" cy="112" r="22" fill="#3b5bdb"/>
      <circle cx="344" cy="132" r="22" fill="#0c8599"/>
      <circle cx="308" cy="168" r="22" fill="#e8a33d"/>
    </g>
    <!-- code slab -->
    <rect x="28" y="220" width="336" height="20" rx="6" fill="#0b2740"/>
    <rect x="40" y="228" width="64" height="5" rx="2.5" fill="#7cc0f5"/>
    <rect x="112" y="228" width="40" height="5" rx="2.5" fill="#e8a33d"/>
    <rect x="160" y="228" width="88" height="5" rx="2.5" fill="#9fb3c8"/>
  </g>
</svg>
