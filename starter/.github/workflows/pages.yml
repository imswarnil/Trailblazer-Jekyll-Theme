# =============================================================================
# Build the site and deploy it to GitHub Pages.
#
# Before this can work, set Settings → Pages → Source to "GitHub Actions".
# With Source left on "Deploy from a branch" the workflow runs, goes green,
# and deploys nothing.
# =============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages

      # JEKYLL_ENV=production is what switches on analytics, comments and the
      # service worker. Without it the deployed site quietly ships none of them.
      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # jekyll build exits 0 even when a Liquid error leaves a page
      # half-rendered — check that the pages that must exist actually do.
      - name: Check the build
        run: |
          set -e
          for path in index.html blog/index.html resume/index.html \
                      sitemap.xml feed.xml assets/css/main.css; do
            test -s "_site/$path" || { echo "missing or empty: $path"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
